name: pitazo
description: "Pitazo — gestión deportiva para canchas de fútbol 7."
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  go_router: ^14.0.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  intl: ^0.20.0
  signalr_netcore: ^1.3.6
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1F4E79"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1F4E79"
  image: assets/images/logo.png
  color_dark: "#1F4E79"
  image_dark: assets/images/logo.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/images/
